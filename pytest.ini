[pytest]
# Project title shown in the HTML report
junit_suite_name = OrangeHRM Automation Tests

# Default options that run every time you type 'pytest'
# -v = verbose output, shows each test name
# --html = generates an HTML report after every run
addopts = -v --html=report.html

# Tell pytest where to find the test files
testpaths = tests

# Only pick up files that match this pattern
python_files = test_*.py

# Only pick up functions/methods that start with test_
python_functions = test_*